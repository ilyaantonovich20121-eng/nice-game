<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars 3D Mobile</title>
    <!-- Подключаем библиотеку Three.js для 3D графики -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e14;
            color: #fff;
        }

        /* КРАСИВОЕ ЛОББИ ИГРЫ (МЕНЮ) */
        #lobby-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: linear-gradient(135deg, #1864ab 0%, #0b2545 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-title {
            font-size: 28px;
            color: #fcc419;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000;
            letter-spacing: 1px;
        }
        .gold-counter {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #ffd43b;
            color: #ffd43b;
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
        }

        /* Выбор персонажей в Лобби */
        .brawlers-showcase {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .brawler-card {
            background: #1c2030;
            border: 4px solid #3b4257;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            width: 140px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .brawler-card.selected {
            border-color: #51cf66;
            background: #2b3d32;
            transform: scale(1.05);
        }
        .brawler-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Кнопка "В БОЙ" */
        .bottom-menu {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .play-button {
            background: linear-gradient(to bottom, #ff922b, #f59f00);
            border: 4px solid #fff;
            border-radius: 40px;
            color: #fff;
            font-size: 26px;
            padding: 15px 60px;
            cursor: pointer;
            text-shadow: 2px 2px 0px #e67e22, 4px 4px 0px #000;
            box-shadow: 0 8px 0px #d9480f, 0 15px 20px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }
        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #d9480f, 0 8px 10px rgba(0,0,0,0.4);
        }

        /* ИГРОВОЙ ЭКРАН И ДВУХДЖОЙСТИКОВОЕ УПРАВЛЕНИЕ */
        #game-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* Мобильные сенсорные зоны и джойстики */
        #controls-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
        }
        /* Левый джойстик (Ходьба) */
        .joystick-pad {
            position: absolute;
            bottom: 40px;
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #left-pad { left: 40px; }
        #right-pad { right: 40px; border-color: rgba(255, 50, 50, 0.5); background: rgba(255,0,0,0.05); }
        
        .joystick-knob {
            width: 45px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #right-knob { background: #ff4d4d; }

        /* ИНТЕРФЕЙС ПОВЕРХ БОЯ (HUD) */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-stats {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 16px;
        }
        .exit-btn {
            background: #e63946;
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            font-size: 14px;
        }
        /* Полоска здоровья над джойстиками */
        .player-hp-bar {
            width: 160px;
            height: 16px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 8px;
            align-self: center;
            margin-bottom: 10px;
            overflow: hidden;
        }
        #player-hp-fill {
            width: 100%;
            height: 100%;
            background: #51cf66;
            transition: width 0.1s;
        }
        .kill-pop {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(245, 159, 0, 0.9);
            border: 2px solid #fff;
            padding: 10px 20px;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            display: none;
            animation: popEffect 1.5s forwards;
        }
        @keyframes popEffect {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ОКНО ЛОББИ (ГЛАВНОЕ МЕНЮ) -->
    <div id="lobby-container">
        <div class="lobby-header">
            <div class="game-title">BRAWL STARS 3D</div>
            <div class="gold-counter">Монеты: <span id="gold-val">0</span> 💰</div>
        </div>

        <div>
            <h3 style="text-align: center; color: #e0e0e0; text-shadow: 1px 1px #000; margin-bottom: 5px;">ВЫБЕРИ БОЙЦА:</h3>
            <div class="brawlers-showcase">
                <!-- Шелли -->
                <div class="brawler-card selected" id="card-shelly" onclick="selectBrawler('shelly')">
                    <div class="brawler-avatar" style="background: #a855f7;">🤠</div>
                    <b style="font-size: 15px;">Шелли</b>
                    <p style="margin: 5px 0 0 0; font-size: 11px; color: #ff8787;">Дробовик (Дальний)</p>
                </div>
                <!-- Эль Примо -->
                <div class="brawler-card" id="card-primo" onclick="selectBrawler('primo')">
                    <div class="brawler-avatar" style="background: #1e3a8a;">💪</div>
                    <b style="font-size: 15px;">Эль Примо</b>
                    <p style="margin: 5px 0 0 0; font-size: 11px; color: #63e6be;">Кулаки (Ближний)</p>
                </div>
            </div>
        </div>

        <div class="bottom-menu">
            <button class="play-button" onclick="startBrawlGame()">В БОЙ</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН (3D МИР) -->
    <div id="game-container">
        <!-- Сенсорные зоны управления -->
        <div id="controls-layer">
            <!-- Левый джойстик (Ходьба) -->
            <div class="joystick-pad" id="left-pad">
                <div class="joystick-knob" id="left-knob"></div>
            </div>
            <!-- Правый джойстик (Атака/Прицеливание) -->
            <div class="joystick-pad" id="right-pad">
                <div class="joystick-knob" id="right-knob"></div>
            </div>
        </div>
        
        <!-- HUD Сверху игры -->
        <div id="hud-layer">
            <div class="hud-top">
                <div class="hud-stats">Повержено: <span id="kills-val">0</span></div>
                <div class="hud-stats" style="color: #ffd43b;">+<span id="earned-val">0</span> 💰</div>
                <button class="exit-btn" onclick="exitToLobby()">Выйти</button>
            </div>
            
            <!-- Полоска жизней снизу по центру экрана -->
            <div class="player-hp-bar">
                <div id="player-hp-fill"></div>
            </div>
        </div>

        <div class="kill-pop" id="kill-ui">Замечен враг уничтожен! +60 💰</div>
    </div>

    <script>
        // --- СОСТОЯНИЕ АККАУНТА ---
        let totalGold = 0;
        let currentBrawler = 'shelly';

        // Характеристики бойцов
        const brawlersConfig = {
