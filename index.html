<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Parkour: Overdrive 1000+ Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background: #03030a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 850px; max-height: 480px; background: #020205; border: 3px solid #1a1c2e; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(0, 255, 242, 0.15); }
        canvas { display: block; width: 100%; height: 100%; }
        .hud-panel { position: absolute; top: 12px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; font-size: 16px; font-weight: bold; font-family: monospace; z-index: 5; text-shadow: 2px 2px 3px #000; }
        .hud-coins { color: #00ffff; }
        .game-screen { position: absolute; inset: 0; background: rgba(5, 6, 15, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; overflow-y: auto; }
        .hidden { display: none !important; }
        h1 { font-size: 32px; color: #00ffff; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px rgba(0,255,242,0.4); text-align: center; margin-bottom: 2px; }
        .sub { font-size: 11px; color: #45a29e; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .menu-btn { padding: 12px 30px; font-size: 16px; font-weight: bold; background: linear-gradient(45deg, #00ffff, #45a29e); border: none; border-radius: 6px; cursor: pointer; color: #05060f; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 255, 242, 0.3); margin: 6px; transition: transform 0.1s; }
        .menu-btn:active { transform: scale(0.95); }
        .shop-wrapper { display: flex; gap: 15px; width: 100%; max-width: 720px; margin-bottom: 12px; }
        .shop-column { flex: 1; background: #0b0c16; padding: 10px; border-radius: 8px; border: 1px solid #1f2833; height: 160px; overflow-y: auto; }
        .shop-column h3 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #00ffff; text-transform: uppercase; border-bottom: 1px solid rgba(0,255,242,0.2); padding-bottom: 4px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #020205; margin-bottom: 5px; border-radius: 6px; font-size: 12px; }
        .shop-item button { padding: 5px 10px; font-size: 10px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #1f2833; color: #fff; }
        .shop-item button.eq { background: #ff4757; }
        .shop-item button.own { background: #2ed573; }
        .levels-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .lvl-btn { background: #111424; border: 2px solid #1f2833; border-radius: 8px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 14px; }
        .lvl-btn.unlocked { border-color: #00ffff; color: #00ffff; }
        .lvl-btn.active-lvl { background: #00ffff; color: #05060f; border-color: #00ffff; }
        .lvl-stars { font-size: 8px; color: #ffd700; margin-top: 2px; }
        .settings-box { width: 100%; max-width: 400px; background: #0b0c16; padding: 15px; border-radius: 8px; border: 1px solid #1f2833; margin-bottom: 15px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .setting-row select { background: #111424; color: #fff; border: 1px solid #45a29e; padding: 4px 8px; border-radius: 4px; }
        #input-pad { position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .pad-group { display: flex; gap: 15px; pointer-events: auto; }
        .pad-btn { width: 68px; height: 68px; border-radius: 50%; background: rgba(11, 12, 22, 0.85); border: 2.5px solid #45a29e; color: #00ffff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; text-transform: uppercase; touch-action: manipulation; }
        .pad-btn:active { background: #00ffff; color: #05060f; }
        #btn-attack { border-color: #ff4757; color: #ff4757; }
        #btn-attack:active { background: #ff4757; color: #fff; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="850" height="480"></canvas>
        <div class="hud-panel">
            <div id="hud-score">Дистанция: 0м / Цель: 200м</div>
            <div id="hud-coins" class="hud-coins">Баланс: 0 🪙</div>
        </div>
        <div id="scr-menu" class="game-screen">
            <h1>Stickman Overdrive</h1>
            <div class="sub">Главы 1-10 • Кампания на выживание</div>
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;" class="hud-coins">Кошелек: <span id="val-wallet">0</span> 🪙</div>
            <div class="shop-wrapper">
                <div class="shop-column">
                    <h3>Костюмы</h3>
                    <div id="sh-skins"></div>
                </div>
                <div class="shop-column">
                    <h3>Арсенал</h3>
                    <div id="sh-weapons"></div>
                </div>
            </div>
            <div class="levels-grid" id="maps-grid"></div>
            <div>
                <button class="menu-btn" id="m-start">В бой</button>
                <button class="menu-btn" id="m-set" style="background: #1f2833; color: #fff; box-shadow: none;">Настройки</button>
            </div>
        </div>
        <div id="scr-settings" class="game-screen hidden">
            <h1>Настройки</h1>
            <div class="sub">Конфигурация производительности</div>
            <div class="settings-box">
                <div class="setting-row">
                    <label>Сложность геймплея</label>
                    <select id="set-diff">
                        <option value="1">Легко (Прогулка)</option>
                        <option value="2" selected>Нормально (Паркур)</option>
                        <option value="3">Хардкор (Овердрайв)</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Эффекты частиц (VFX)</label>
                    <select id="set-vfx">
                        <option value="on">Включены (Красиво)</option>
                        <option value="off">Выключены (Для слабых тел)</option>
                    </select>
                </div>
            </div>
            <button class="menu-btn" id="set-back">Назад</button>
        </div>
        <div id="scr-over" class="game-screen hidden">
            <h1 id="over-title" style="color: #ff4757;">Забег прерван</h1>
            <p id="over-desc" style="margin-bottom: 15px; font-size: 16px; color: #c1c8e4; font-family: monospace; text-align: center;"></p>
            <div>
                <button class="menu-btn" id="o-retry">Повторить</button>
                <button class="menu-btn" id="o-lobby" style="background: #1f2833; color: #fff; box-shadow: none;">Карта глав</button>
            </div>
        </div>
        <div id="input-pad">
            <div class="pad-group">
                <div class="pad-btn" id="g-jump">Вверх</div>
                <div class="pad-btn" id="g-slide">Подкат</div>
            </div>
            <div class="pad-group">
                <div class="pad-btn" id="g-attack">Атака</div>
            </div>
        </div>
    </div>
<script>
