<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 3D Mobile</title>
    <!-- Подключаем Three.js для 3D графики -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1115;
            color: #fff;
        }
        /* Главное меню */
        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #151821 0%, #0a0b0d 100%);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 2px solid #ff7b00;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff7b00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats {
            font-size: 16px;
            background: #222633;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #3b4257;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding: 0 10px;
        }
        .tab-btn {
            background: #1c2030;
            border: 1px solid #3b4257;
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            flex: 1;
            max-width: 150px;
            text-align: center;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #ff7b00;
            border-color: #ff9d42;
            color: #000;
            font-weight: bold;
        }
        .content-section {
            flex: 1;
            display: none;
            padding: 20px;
            overflow-y: auto;
        }
        .content-section.active {
            display: block;
        }
        /* Вкладка Играть */
        .play-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70%;
        }
        .play-btn {
            background: linear-gradient(to right, #ff5100, #ff8800);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,81,0,0.4);
            text-transform: uppercase;
        }
        /* Кейсы */
        .case-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .case-card {
            background: #1c2030;
            border: 2px solid #3b4257;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 280px;
        }
        .case-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ff9d42;
        }
        .roulette-container {
            width: 100%;
            max-width: 100%;
            height: 100px;
            border: 2px solid #ff7b00;
            background: #0b0d13;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            display: none;
        }
        .roulette-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background: #ff3300;
            z-index: 5;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 5px;
            height: 80px;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .roulette-item {
            width: 90px;
            height: 80px;
            margin: 0 4px;
            background: #222633;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            padding: 5px;
            border-bottom: 4px solid #fff;
        }
        /* Инвентарь */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }
        .item-card {
            background: #1c2030;
            border: 2px solid #3b4257;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            position: relative;
        }
        .item-card.equipped {
            border-color: #00ff66;
            background: #152b20;
        }
        .item-card.equipped::after {
            content: "EQP";
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            background: #00ff66;
            color: #000;
            padding: 1px 3px;
            font-weight: bold;
            border-radius: 2px;
        }

        /* 3D Игровой интерфейс мобильной версии */
        #game-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 5px;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 4px;
            border-left: 3px solid #ff7b00;
            font-size: 14px;
            font-weight: bold;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ff66;
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { left: 4px; top: -8px; width: 2px; height: 26px; }

        .kill-feed {
            position: absolute;
            right: 15px;
            top: 70px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            display: none;
            color: #00ff66;
            font-size: 14px;
            font-weight: bold;
        }
        .exit-btn {
            background: #ff3300;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            pointer-events: auto;
        }

        /* МОБИЛЬНЫЕ ОРГАНЫ УПРАВЛЕНИЯ */
        #touch-zones {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            top: 0;
            left: 0;
        }
        /* Джойстик (Левая зона) */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
        }
        /* Кнопка Огонь (Справа) */
        #fire-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #ff3300, #ff6600);
            border: 3px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255,51,0,0.5);
        }
        #fire-btn:active {
            transform: scale(0.9);
            background: #b32400;
        }
    </style>
</head>
<body>

    <!-- МЕНЮ ИГРЫ -->
    <div id="menu-container">
        <header>
            <div class="logo">Sandstone Mobile</div>
            <div class="stats"><span id="balance-val">500</span> G</div>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('play')">Играть</button>
            <button class="tab-btn" onclick="switchTab('cases')">Кейсы</button>
