<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mobile Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #0a1218; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; touch-action: manipulation; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  .top-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 30px; border: 1px solid rgba(0,255,200,0.4); }
  .stat { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; }
  .hp-val { color: #4dff88; } .ammo-val { color: #ffd34d; } .coins-val { color: #ffd34d; } .wave-val { color: #ff6b6b; }
  #hpbar-wrap { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 150px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
  #hpbar { height: 100%; width: 100%; background: #4dff88; transition: width 0.1s; }

  /* Сенсорное управление */
  #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(0,255,200,0.5); pointer-events: auto; touch-action: none; }
  #joystick-knob { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #0ff, #007a7a); box-shadow: 0 0 15px rgba(0,255,255,0.7); pointer-events: none; }
  
  #fire-btn { position: absolute; bottom: 35px; right: 30px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff6b6b, #b30000); border: 3px solid rgba(255,150,150,0.8); display: flex; align-items: center; justify-content: center; font-size: 32px; pointer-events: auto; touch-action: none; }
  #fire-btn:active { transform: scale(0.9); background: #ff2222; }
  
  #reload-btn { position: absolute; bottom: 145px; right: 45px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,210,80,0.2); border: 3px solid rgba(255,210,80,0.8); display: flex; align-items: center; justify-content: center; font-size: 26px; pointer-events: auto; touch-action: manipulation; }

  #menu-buttons { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 10px; }
  .mbtn { pointer-events: auto; width: 50px; height: 50px; border-radius: 12px; background: rgba(0,0,0,0.7); border: 2px solid rgba(0,255,200,0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; touch-action: manipulation; }
  .mbtn:active { background: rgba(0,255,200,0.3); }

  /* Оверлеи */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4,10,14,0.95); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }
  .overlay.active { display: flex; }
  .panel { width: 100%; max-width: 500px; background: linear-gradient(160deg, #0e1a22, #0a1218); border: 1px solid rgba(0,255,200,0.4); border-radius: 16px; padding: 20px; max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
  .panel h2 { font-size: 22px; margin-bottom: 10px; color: #0ff; text-align: center; }
  
  /* Кнопки */
  .btn { display: block; width: 100%; padding: 18px; margin-bottom: 12px; background: linear-gradient(90deg, #003d33, #006655); border: 1px solid rgba(0,255,200,0.5); color: #fff; border-radius: 12px; font-size: 18px; font-weight: 700; text-align: center; cursor: pointer; pointer-events: auto; text-decoration: none; border: none; outline: none; touch-action: manipulation; }
  .btn:active { background: #008877; transform: scale(0.98); }
  .btn.red { background: linear-gradient(90deg,#4a0d0d,#7a1414); border-color: rgba(255,80,80,0.6); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .wcard { background: rgba(0,255,200,0.08); border: 1px solid rgba(0,255,200,0.3); border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
  .wcard.equipped { border-color: #0ff; background: rgba(0,255,200,0.2); }
  .wcard .wico { font-size: 32px; margin-bottom: 4px; }
  .wcard .wname { font-size: 15px; font-weight: 700; }
  .wcard .wstat { font-size: 12px; color: #8cb; margin-top: 2px; }
  .wcard.locked { opacity: 0.5; }

  .case-box { text-align: center; padding: 15px; border: 1px solid rgba(255,200,0,0.4); border-radius: 12px; background: rgba(255,200,0,0.08); margin-bottom: 12px; }
  .case-ico { font-size: 50px; margin-bottom: 6px; }
  
  #case-reel { display: flex; gap: 8px; margin: 15px 0; overflow: hidden; height: 100px; position: relative; border-top: 2px solid rgba(0,255,200,0.5); border-bottom: 2px solid rgba(0,255,200,0.5); padding: 6px 0; align-items: center; }
  #case-reel-inner { display: flex; gap: 8px; transition: transform 3.5s cubic-bezier(.15,.7,.25,1); }
  .reel-item { flex: 0 0 80px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); font-size: 10px; font-weight: 700; }
  .reel-item .ri-ico { font-size: 26px; }
  .reel-pointer { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: #0ff; box-shadow: 0 0 10px #0ff; transform: translateX(-50%); z-index: 2; }

  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-10px); background: rgba(0,0,0,0.9); border: 1px solid #0ff; color: #0ff; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 14px; opacity: 0; transition: .3s; z-index: 100; pointer-events: none; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="top-bar">
    <div class="stat">❤️ <span class="hp-val" id="hp-val">100</span></div>
    <div class="stat">🔫 <span class="ammo-val" id="ammo-val">12/12</span></div>
    <div class="stat">🪙 <span class="coins-val" id="hud-coins">0</span></div>
    <div class="stat">🌊 <span class="wave-val" id="wave-val">0/0</span></div>
  </div>
  <div id="hpbar-wrap"><div id="hpbar"></div></div>

  <div id="menu-buttons">
    <div class="mbtn" onclick="Game.openInventory()">🎒</div>
    <div class="mbtn" onclick="Game.openCases()">📦</div>
    <div class="mbtn" onclick="Game.pauseGame()">⏸️</div>
  </div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="fire-btn">🔥</div>
  <div id="reload-btn" onclick="Game.reload()">🔄</div>
</div>

<div id="toast"></div>

<!-- СТАРТОВЫЙ ЭКРАН -->
<div class="overlay active" id="start-overlay">
  <div class="panel" style="text-align:center">
    <h2 style="font-size:26px">⚡ МОБИЛЬНЫЙ ШУТЕР</h2>
    
    <button class="btn" onclick="Game.startFirstMatch()" style="background:#00b377;color:#000;font-size:18px">▶ НАЧАТЬ ИГРУ</button>
    <button class="btn" onclick="Game.openCases()">📦 КЕЙСЫ</button>
    <button class="btn" onclick="Game.openInventory()">🎒 ИНВЕНТАРЬ</button>
  </div>
</div>

<!-- ИНВЕНТАРЬ -->
<div class="overlay" id="inventory-overlay">
  <div class="panel">
    <h2>🎒 ИНВЕНТАРЬ</h2>
    <div class="grid" id="inventory-grid"></div>
    <div style="height:12px"></div>
    <button class="btn red" onclick="Game.closeAll()">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- КЕЙСЫ -->
<div class="overlay" id="cases-overlay">
  <div class="panel">
    <h2>📦 КЕЙСЫ</h2>
    <p style="text-align:center;margin-bottom:15px;font-size:14px">Баланс: <b id="coins-val" style="color:#ffd34d;font-size:18px">0</b> 🪙</p>
    <div class="case-box">
      <div class="case-ico">📦</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:10px">Обычный кейс</div>
      <button class="btn" onclick="Game.openCase('common')">ОТКРЫТЬ — 100 🪙</button>
    </div>
    <div class="case-box" style="border-color:rgba(181,107,255,0.5);background:rgba(181,107,255,0.1)">
      <div class="case-ico">🎁</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:10px">Эпический кейс</div>
      <button class="btn" onclick="Game.openCase('epic')" style="background:#5c2a8a">ОТКРЫТЬ — 300 🪙</button>
    </div>
    <div id="case-reel" style="display:none">
      <div class="reel-pointer"></div>
      <div id="case-reel-inner"></div>
    </div>
    <button class="btn red" onclick="Game.closeAll()">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- СМЕРТЬ -->
<div class="overlay" id="gameover-overlay">
  <div class="panel" style="text-align:center">
    <h2 id="go-title">☠️ ВЫ ПОГИБЛИ</h2>
    <div style="font-size:40px;font-weight:800;color:#0ff;margin:10px 0" id="final-score">0</div>
    <div style="font-size:15px;margin-bottom:15px;color:#ffd34d">Награда: <b id="reward-val">0</b> 🪙</div>
    <button class="btn" onclick="Game.restartMatch()">ИГРАТЬ СНОВА</button>
    <button class="btn red" onclick="Game.showMenu()">В МЕНЮ</button>
  </div>
</div>

<!-- ПАУЗА -->
<div class="overlay" id="pause-overlay">
  <div class="panel" style="max-width:350px;text-align:center">
    <h2>⏸️ ПАУЗА</h2>
    <button class="btn" onclick="Game.resume()">ПРОДОЛЖИТЬ</button>
    <button class="btn red" onclick="Game.showMenu()">В МЕНЮ</button>
  </div>
</div>

<script>
const Game = (() => {
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;
