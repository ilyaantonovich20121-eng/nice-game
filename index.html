<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Roof Parkour 2D</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: #0b0c10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; color: #fff; }
        
        #game-wrapper { position: relative; width: 800px; height: 400px; border: 4px solid #1f2833; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: 100%; background: linear-gradient(to bottom, #0b0c10, #1f2833); }
        
        .hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; font-size: 20px; font-weight: bold; font-family: monospace; z-index: 2; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hud-coins { color: #66fcf1; }
        
        .screen { position: absolute; inset: 0; background: rgba(11, 12, 16, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 30px; pointer-events: auto; }
        .hidden { display: none !important; }
        h1 { font-size: 36px; margin-bottom: 10px; color: #66fcf1; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
        
        .menu-btn { padding: 14px 30px; font-size: 20px; font-weight: bold; background: #66fcf1; border: none; border-radius: 6px; cursor: pointer; color: #0b0c10; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2); pointer-events: auto; }
        .menu-btn:hover { transform: translateY(-2px); background: #45a29e; box-shadow: 0 6px 20px rgba(102, 252, 241, 0.4); }
        .menu-btn:active { transform: translateY(1px); }

        .shop-box { display: flex; gap: 20px; width: 100%; max-width: 680px; margin: 20px 0; pointer-events: auto; }
        .shop-column { flex: 1; background: #1f2833; padding: 15px; border-radius: 8px; border: 1px solid #45a29e; height: 180px; overflow-y: auto; }
        .shop-column h3 { font-size: 16px; margin-bottom: 12px; text-align: center; color: #66fcf1; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(102,252,241,0.2); padding-bottom: 5px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0b0c10; margin-bottom: 8px; border-radius: 6px; font-size: 14px; border: 1px solid transparent; }
        .shop-item.active-item { border-color: #66fcf1; }
        .shop-item button { padding: 6px 12px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #45a29e; color: #fff; transition: 0.1s; pointer-events: auto; }
        .shop-item button:hover { background: #66fcf1; color: #0b0c10; }
        .shop-item button.eq { background: #ff4757; color: #fff; }
        .shop-item button.own { background: #2ed573; color: #fff; }

        #touch-controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .control-group { display: flex; gap: 20px; pointer-events: auto; }
        .action-btn { width: 75px; height: 75px; border-radius: 50%; background: rgba(31, 40, 51, 0.85); border: 2px solid #45a29e; color: #66fcf1; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.3); pointer-events: auto; touch-action: manipulation; }
        .action-btn:active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; transform: scale(0.92); }
        #btn-attack { border-color: #ff4757; color: #ff4757; }
        #btn-attack:active { background: #ff4757; color: #fff; border-color: #ff4757; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" width="800" height="400"></canvas>
        
        <div class="hud">
            <div id="hud-score">Дистанция: 0м</div>
            <div id="hud-coins" class="hud-coins">Монеты: 0 🪙</div>
        </div>

        <div id="screen-menu" class="screen">
            <h1>Stickman Roof Run</h1>
            <div style="font-size: 18px; font-weight: bold;" class="hud-coins">Кошелек: <span id="shop-wallet">0</span> 🪙</div>
            
            <div class="shop-box">
                <div class="shop-column">
                    <h3>Костюмы</h3>
                    <div id="container-skins"></div>
                </div>
                <div class="shop-column">
                    <h3>Оружейная</h3>
                    <div id="container-weapons"></div>
                </div>
            </div>

            <button id="btn-start" class="menu-btn">Начать игру</button>
        </div>

        <div id="screen-over" class="screen hidden">
            <h1 style="color: #ff4757;">Забег окончен</h1>
            <p id="over-stats" style="margin-bottom: 25px; font-size: 20px; color: #c1c8e4;"></p>
            <button id="btn-restart" class="menu-btn">В меню</button>
        </div>

        <div id="touch-controls">
            <div class="control-group">
                <div class="action-btn" id="btn-jump">Вверх</div>
                <div class="action-btn" id="btn-slide">Подкат</div>
            </div>
            <div class="control-group">
                <div class="action-btn" id="btn-attack">Атака</div>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let gameActive = false;
let distanceScore = 0;
let coinBalance = 150; 
let selectedSkin = 'classic';
let selectedWeapon = 'none';

const shopConfig = {
    skins: [
        { id: 'classic', name: 'Обычный', price: 0, color: '#ffffff', detailColor: '#888888' },
        { id: 'phantom', name: 'Фантом', price: 40, color: '#ff4757', detailColor: '#2f3542' },
        { id: 'cyber', name: 'Кибер', price: 80, color: '#00d2d3', detailColor: '#54a0ff' },
        { id: 'elite', name: 'Легенда', price: 150, color: '#ffa502', detailColor: '#ffffff' }
    ],
    weapons: [
        { id: 'none', name: 'Кулаки', price: 0, type: 'melee', dist: 45 },
        { id: 'sword', name: 'Меч самурая', price: 35, type: 'melee', dist: 70 },
        { id: 'blaster', name: 'Бластер', price: 90, type: 'range' }
    ],
    unlockedSkins: ['classic'],
    unlockedWeapons: ['none']
};

let stickman = {
    x: 120, y: 240, w: 30, h: 65,
    vy: 0, g: 0.65, jForce: -13.5,
    jumping: false, sliding: false, slideFrames: 0,
    attacking: false, attackFrames: 0
};

let obstacles = [];
let projectiles = [];
let VFXParticles = [];
let currentSpeed = 5.5;
let spawnCooldown = 0;
let roofHeight = 310;

function renderEnvironment() {
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0f0c20');
    skyGrad.addColorStop(1, '#151930');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1b1f38';
    ctx.fillRect(80, 130, 140, 270);
    ctx.fillRect(320, 90, 210, 310);
    ctx.fillRect(610, 160, 130, 240);

    ctx.fillStyle = 'rgba(102, 252, 241, 0.15)';
    ctx.fillRect(110, 160, 20, 30);
    ctx.fillRect(360, 120, 30, 40);
    ctx.fillRect(440, 150, 30, 40);

    ctx.fillStyle = '#242b4d';
    ctx.fillRect(0, roofHeight, canvas.width, canvas.height - roofHeight);
    
    ctx.fillStyle = '#66fcf1';
    ctx.fillRect(0, roofHeight, canvas.width, 4);
}

function executeJump() {
    if (!stickman.jumping && !stickman.sliding && gameActive) {
        stickman.vy = stickman.jForce;
        stickman.jumping = true;
    }
}

function executeSlide() {
    if (!stickman.jumping && !stickman.sliding && gameActive) {
        stickman.sliding = true;
        stickman.h = 32;
        stickman.y += 33;
        stickman.slideFrames = 38;
    }
}

function executeAttack() {
    if (stickman.attacking || !gameActive) return;
    stickman.attacking = true;
    stickman.attackFrames = 12;

    let wepInfo = shopConfig.weapons.find(w => w.id === selectedWeapon);
    if (wepInfo && wepInfo.type === 'range') {
        projectiles.push({
            x: stickman.x + stickman.w,
            y: stickman.y + stickman.h / 2 - 2,
            speed: 14
        });
    }
}

function processPlayerPhysics() {
    if (stickman.sliding) {
        stickman.slideFrames--;
        if (stickman.slideFrames <= 0) {
            stickman.sliding = false;
            stickman.h = 65;
            stickman.y -= 33;
        }
    } else {
        stickman.vy += stickman.g;
        stickman.y += stickman.vy;
        
        if (stickman.y >= roofHeight - stickman.h) {
            stickman.y = roofHeight - stickman.h;
            stickman.vy = 0;
            stickman.jumping = false;
        }
    }

    if (stickman.attacking) {
        stickman.attackFrames--;
        if (stickman.attackFrames <= 0) stickman.attacking = false;
    }
}

function drawStickman() {
    let skin = shopConfig.skins.find(s => s.id === selectedSkin);
    ctx.strokeStyle = skin.color;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.shadowBlur = selectedSkin === 'cyber' ? 8 : 0;
    ctx.shadowColor = skin.color;

    let cx = stickman.x + stickman.w / 2;
    let cy = stickman.y;

    if (stickman.sliding) {
        ctx.beginPath();
        ctx.arc(cx + 12, cy + 12, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy + 22);
        ctx.lineTo(cx + 10, cy + 22);
        ctx.stroke();
    } else {
